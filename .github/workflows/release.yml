name: Release

# Conventional-commit driven release: changelog generated from commit
# subjects, CalVer tag + semver version, contributors resolved via
# contributors/emails/ (salvage attribution). Maintainers trigger it with
# a comment `/release patch|minor|major` (workflow_dispatch here; add the
# comment trigger via a small workflow that calls this one).
#
# Upstream cadence for reference: 30 releases in 6 months (≈weekly+),
# v0.20.6-style semver names + v2026.8.27-style CalVer tags, 549
# chore(release) commits generated by the tool.

on:
  workflow_dispatch:
    inputs:
      part:
        description: "Version part to bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run release tool
        env:
          PART: ${{ github.event.inputs.part }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "release-bot"
          git config user.email "actions@github.com"
          python3 scripts/release.py --part "$PART" --push --tag --gh-release
