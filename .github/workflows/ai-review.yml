name: AI PR Review

# Automated code review on every PR. Advisory only — never approves,
# never blocks merge (that's the human's job). Posts one comment.
#
# Provider-agnostic: uses any OpenAI-compatible endpoint.
#   Secrets required (Settings → Secrets → Actions):
#     AI_REVIEW_API_KEY    – API key for the provider
#   Optional:
#     AI_REVIEW_BASE_URL   – default: https://api.openai.com/v1
#     AI_REVIEW_MODEL      – default: gpt-4o  (vars, not secrets)
#
# When AI_REVIEW_API_KEY is missing the job skips gracefully —
# so the template works out of the box and upgrades when you add the key.
#
# Security model (learned from hermes-agent):
#   - Runs on pull_request_target? NO — plain `pull_request`, unprivileged.
#   - The reviewer needs NO write permissions beyond pull-requests: write
#     for the comment, and it reads the diff from the event payload +
#     the API (not from checking out untrusted PR code).
#   - We never `actions/checkout` the PR head in this workflow. The review
#     script fetches the diff via the authenticated API instead.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip forks and bots; skip entirely without a key
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.type != 'Bot')
    steps:
      - name: Check for API key
        id: check
        env:
          HAS_KEY: ${{ secrets.AI_REVIEW_API_KEY != '' }}
        run: echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main (scripts + prompts only)
        if: steps.check.outputs.has_key == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            prompts
            AGENTS.md

      - name: Run AI review
        if: steps.check.outputs.has_key == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL || 'https://api.openai.com/v1' }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'gpt-4o' }}
          AI_REVIEW_MAX_TOKENS: ${{ vars.AI_REVIEW_MAX_TOKENS || '4000' }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: python3 scripts/ai_review.py
